defaults:
  - override hydra/sweeper: optuna
  - override hydra/sweeper/sampler: tpe

random_state: 42

exp_root_folder: experiments/classifier_hpo/${data.label}

hydra:
  sweeper:
    direction: maximize
    study_name: ${now:%Y/%m/%d}-${now:%H:%M:%S}
    storage: sqlite:///${exp_root_folder}/classifier_hpo.sqlite3
    n_jobs: 1
    n_trials: 100
    params:
      # Uniform distributions:
      # interval(start, stop) is UniformDistribution
      # int(interval(start, stop)) is IntUniformDistribution
      # tag(log, int(interval(start, stop))) is IntLogUniformDistribution
      # Range:
      # default is IntUniformDistribution
      # shuffle(range(start,stop)) is CategoricalDistribution
      # if any of start, stop or step is float, then it is FloatUniformDistribution
      # Choice:
      # choice(a,b,c,d) is CategoricalDistribution
      pipeline.classifier.eta: interval(0.0, 1.0) # range[0,1] default 0.3
      pipeline.classifier.gamma: interval(0.0, 10.0)
      pipeline.classifier.max_depth: int(interval(3, 10)) # default 6. More overfit more
      pipeline.classifier.lambda: tag(log, interval(1.0, 1000.0)) # 0,inf. d=1
      pipeline.classifier.alpha: tag(log, interval(1.0, 1000.0)) #default 0, [0,inf[
      pipeline.classifier.min_child_weight: interval(0.0, 10.0) #0,10
      pipeline.classifier.subsample: interval(0.5, 1.0)
      pipeline.classifier.n_estimators: int(interval(50, 150))
  sweep:
    dir: ${exp_root_folder}/${data.label}
    subdir: ${now:%Y%m%d}-${now:%H%M%S}

data:
  label: ???
  folder: data # relative path
  path: ./${data.folder}/${data.label}
  drop_duplicates: false
  target_column: ???
  tapas_data_processor: 
    _target_: ???

pipeline:
  train_size: 0.8
  numerical_scaler: 
    _target_: sklearn.preprocessing.StandardScaler
  classifier:
    _target_: xgboost.XGBClassifier
    random_state: ${random_state}
    eta: 0.3 # range[0,1] default 0.3
    gamma: 0
    max_depth: 6
    lambda: 1
    alpha: 0 #default 0, [0,inf[
    min_child_weight: 1 #0,10
    subsample: 1
    n_estimators: 100

eval:
  f1_avg: 'macro'
  n_cv_splits: 5
  n_repetitions: 100